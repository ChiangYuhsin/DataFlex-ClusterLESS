selectors:
  nice:
    name: nice
    params:
      cache_dir: ../dataflex_saves/nice_output
      gradient_type: adam
      proj_dim: 4096
      seed: 123
      save_interval: 16
      reward_model_backend: local_vllm
      reward_backend_params:
        local_vllm:
          hf_model_name_or_path: meta-llama/Llama-3.1-8B
          vllm_tensor_parallel_size: 1
          vllm_temperature: 0.0
          vllm_top_p: 0.9
          vllm_max_tokens: 512
          vllm_top_k: 40
          vllm_seed: 42
          vllm_max_model_len: null
          vllm_gpu_memory_utilization: 0.9
        api:
          api_url: https://api.openai.com/v1/chat/completions
          api_key: DF_API_KEY
          model_name: gpt-4o
          temperature: 0.0
      mc_samples: 4
      max_new_tokens: 512
      generation_temperature: 0.7
      max_prompt_length: 4096
  less:
    name: less
    params:
      cache_dir: ../dataflex_saves/less_output
      gradient_type: adam
      proj_dim: 4096
      seed: 123
      save_interval: 16
  cluster_less:
    name: cluster_less
    params:
      cache_dir: ../dataflex_saves/cluster_less_output
      gradient_type: adam
      proj_dim: 4096
      seed: 123
      save_interval: 16
      cluster_size: 64
      samples_per_cluster: 3
      clustering_batch_size: 8
      clustering_max_iter: 10
      assignment_chunk_size: 4096
      clustering_method: kmeans
      representative_strategy: random
      cluster_update_interval: 1
  loss:
    name: loss
    params:
      cache_dir: ../dataflex_saves/loss_output
      focus: medium
  delta_loss:
    name: delta_loss
    params:
      cache_dir: ../dataflex_saves/delta_loss_output
      window_size: 0.2
  tsds:
    name: tsds
    params:
      probs_path: ./src/dataflex/offline_selector/tsds_probs.npy
      cache_dir: ../dataflex_saves/tsds_output
  near:
    name: near
    params:
      indices_path: ./src/dataflex/offline_selector/top_indices.npy
      cache_dir: ../dataflex_saves/near_output
  random:
    name: random
    params:
      cache_dir: ../dataflex_saves/random_output
      seed: 42
      replacement: false
  custom:
    name: custom
    params:
      cache_dir: ../dataflex_saves/custom_output
mixers:
  random:
    name: random
    params:
      seed: 42
  doremi:
    name: doremi
    params:
      reference_model_path: /path/to/dataflex_saves/Qwen2.5-0.5B/doremi_step1_static_qwen_pt_full_result/checkpoint-xxx
      reweight_eta: 0.1
      reweight_eps: 0.01
  static:
    name: static
    params:
      proportions:
      - 0.5
      - 0.5
  odm:
    name: odm
    params:
      alpha: 0.9
      warmup_steps: 2000
      reward_scale: 15.0
      min_exploration_rate: 0.03
      initial_proportions:
      - 0.5
      - 0.5
  dynamic_moe:
    name: dynamic_moe
    params:
      eta: 10.0
      c: 0.05
      collect_steps: 5
      eval_samples: 1000
      eval_batch_size: 32
weighters:
  loss:
    name: loss
    params:
      strategy: linupper
      delta: 1.0
  custom:
    name: custom
    params:
      strategy: uniform
